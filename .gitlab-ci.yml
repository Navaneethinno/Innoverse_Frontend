# GitLab pipeline for the admin portal.
#
# Merge requests: check, secret-scan.
# main:           check, secret-scan, build-uat, deploy-uat.
# Tags vX.Y.Z:    deploy-production (manual).
#
# VITE_ values for UAT are project CI/CD variables (protected, main only).
# Production builds on the PCI laptop with its own settings.

variables:
  PORTAL: "admin"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/

stages:
  - check
  - build
  - deploy

.npm-cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

check:
  stage: check
  image: node:24-alpine
  tags: [web-check]
  interruptible: true
  extends: .npm-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # Placeholders so the build compiles; this dist is not kept.
    VITE_API_BASE_URL: "https://api.example.invalid"
    VITE_AUTH_BASIC_USERNAME: "ci-placeholder"
    VITE_AUTH_BASIC_PASSWORD: "ci-placeholder"
    VITE_INSTITUTION_DRAFT_STATUS_CODE: "9"
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm run test:run
    - npm run build
    - rm -rf dist

secret-scan:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  tags: [web-check]
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - gitleaks detect --source . --no-banner --redact --exit-code 1

build-uat:
  stage: build
  image: node:24-alpine
  tags: [web-check]
  extends: .npm-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - test -n "$VITE_API_BASE_URL" || { echo "VITE_API_BASE_URL is not set"; exit 1; }
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

deploy-uat:
  stage: deploy
  tags: [uat-deploy-web]
  needs: [build-uat]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_STRATEGY: none
  environment:
    name: uat
    url: https://innoverse-admin.innovitegra.in
  script:
    - sudo -n /usr/local/bin/inv-web-deploy "$PORTAL" "$CI_PROJECT_DIR/dist"

deploy-production:
  stage: deploy
  tags: [prod-pci]
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: manual
      allow_failure: false
  environment:
    name: production
  script:
    - sudo -n /usr/local/sbin/inv-web-prod-deploy "$PORTAL" "$CI_PROJECT_DIR" "$CI_COMMIT_TAG"
